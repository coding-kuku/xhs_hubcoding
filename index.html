<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061e27">
  <title>港口开仓</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="game-shell">
    <header class="topbar">
      <div class="brand-block">
        <p>临港打捞拍卖</p>
        <h1>港口开仓</h1>
      </div>
      <div class="top-stats" aria-label="玩家资产">
        <div class="top-stat">
          <span>周转金</span>
          <strong id="cashStat">¥6,000</strong>
        </div>
        <div class="top-stat">
          <span>仓位</span>
          <strong id="warehouseStat">0/50</strong>
        </div>
        <div class="top-stat">
          <span>热度</span>
          <strong id="heatStat">0</strong>
        </div>
      </div>
    </header>

    <main id="viewRoot" class="view-root" aria-live="polite">
      <section id="boardView" class="game-view is-active"></section>
      <section id="detailView" class="game-view"></section>
      <section id="auctionView" class="game-view"></section>
      <section id="openingView" class="game-view"></section>
      <section id="dispositionView" class="game-view"></section>
      <section id="warehouseView" class="game-view"></section>
      <section id="marketView" class="game-view"></section>
      <section id="collectionView" class="game-view"></section>
    </main>

    <aside id="liveTicker" class="live-ticker">
      <span class="live-pulse"></span>
      <div>
        <strong>直播间</strong>
        <p id="liveMessage">港口信号已接通，等你开第一柜。</p>
      </div>
      <span id="viewerCount" class="viewer-count">0 人</span>
    </aside>

    <nav id="bottomNav" class="bottom-nav" aria-label="主导航">
      <button class="nav-button is-active" type="button" data-tab="board">
        <i class="nav-icon icon-auction"></i><span>拍卖场</span>
      </button>
      <button class="nav-button" type="button" data-tab="warehouse">
        <i class="nav-icon icon-warehouse"></i><span>仓库</span>
      </button>
      <button class="nav-button" type="button" data-tab="market">
        <i class="nav-icon icon-market"></i><span>交易摊</span>
      </button>
      <button class="nav-button" type="button" data-tab="collection">
        <i class="nav-icon icon-collection"></i><span>藏品册</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status"></div>
    <div id="modalRoot" class="modal-root" hidden></div>
  </div>

  <script src="./src/core/daily-generator.js"></script>
  <script src="./src/core/game-engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
