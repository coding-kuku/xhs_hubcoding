<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07303A"/>
      <stop offset="0.55" stop-color="#061F29"/>
      <stop offset="1" stop-color="#041820"/>
    </linearGradient>
    <linearGradient id="container" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B85D44"/>
      <stop offset="0.58" stop-color="#934332"/>
      <stop offset="1" stop-color="#6F3028"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43D5B7"/>
      <stop offset="1" stop-color="#22BDAF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#16B9A4" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#16B9A4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#020E14" flood-opacity="0.45"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#20B7A8" flood-opacity="0.22"/>
    </filter>
    <clipPath id="containerClip">
      <rect x="39" y="329" width="312" height="146" rx="12"/>
    </clipPath>
  </defs>

  <!-- 海港夜色基底 -->
  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="328" cy="73" r="141" fill="url(#glow)"/>
  <circle cx="25" cy="501" r="166" fill="url(#glow)" opacity="0.42"/>
  <path d="M0 146H390" stroke="#2B6470" stroke-opacity="0.24"/>
  <path d="M307 18V77M307 23L353 44M353 44V68M307 31L274 49M274 49V74" fill="none" stroke="#52A8A5" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M270 74H366M287 74V55H341V74" fill="none" stroke="#52A8A5" stroke-opacity="0.11" stroke-width="2"/>

  <!-- 顶部品牌与资产 -->
  <text x="16" y="26" fill="#52D8C2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2">临港打捞拍卖</text>
  <text x="16" y="51" fill="#F4FAF8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1">港口开仓</text>

  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <rect x="173" y="18" width="64" height="37" rx="11" fill="#092A33" stroke="#24535B"/>
    <text x="182" y="31" fill="#6F979B" font-size="7">周转金</text>
    <text x="182" y="46" fill="#F3C964" font-size="11" font-weight="800">¥6,000</text>
    <rect x="243" y="18" width="59" height="37" rx="11" fill="#092A33" stroke="#24535B"/>
    <text x="252" y="31" fill="#6F979B" font-size="7">仓位</text>
    <text x="252" y="46" fill="#EAF7F4" font-size="11" font-weight="800">0/30</text>
    <rect x="308" y="18" width="66" height="37" rx="11" fill="#092A33" stroke="#24535B"/>
    <text x="317" y="31" fill="#6F979B" font-size="7">直播热度</text>
    <text x="317" y="46" fill="#EAF7F4" font-size="11" font-weight="800">0</text>
  </g>

  <!-- 今日行情，只留一条简洁信息 -->
  <rect x="16" y="70" width="358" height="37" rx="12" fill="#082932" stroke="#1C4B55"/>
  <circle cx="31" cy="88.5" r="4" fill="#43D5B7"/>
  <text x="41" y="92" fill="#98BAB9" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9">今日行情</text>
  <text x="101" y="92" fill="#56D7BC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="700">电子器材 +16%</text>
  <text x="207" y="92" fill="#D37B69" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="700">家具 -22%</text>
  <rect x="307" y="78" width="56" height="21" rx="8" fill="#113B43"/>
  <text x="335" y="92" text-anchor="middle" fill="#B8D5D2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">仅今日</text>

  <!-- 拍卖场标题 -->
  <text x="16" y="140" fill="#48D5BB" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.6">DAILY AUCTION</text>
  <text x="16" y="166" fill="#F5FBF9" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800">今日货柜</text>
  <text x="374" y="165" text-anchor="end" fill="#789B9E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9">5 柜 · 今日不补货</text>

  <!-- 五个货柜的紧凑选择条 -->
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <rect x="16" y="181" width="64" height="59" rx="13" fill="#092933" stroke="#28515A"/>
    <text x="27" y="198" fill="#668D91" font-size="8" font-weight="700">01 / 低</text>
    <text x="27" y="217" fill="#F1F8F6" font-size="13" font-weight="800">¥570</text>
    <rect x="27" y="226" width="26" height="3" rx="1.5" fill="#50747A"/>

    <rect x="88" y="181" width="64" height="59" rx="13" fill="#092933" stroke="#28515A"/>
    <text x="99" y="198" fill="#668D91" font-size="8" font-weight="700">02 / 低</text>
    <text x="99" y="217" fill="#F1F8F6" font-size="13" font-weight="800">¥640</text>
    <rect x="99" y="226" width="35" height="3" rx="1.5" fill="#50747A"/>

    <rect x="160" y="177" width="70" height="67" rx="15" fill="#103B43" stroke="#49D3BB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="172" y="196" fill="#57D8C0" font-size="8" font-weight="800">03 / 中</text>
    <text x="172" y="218" fill="#FFFFFF" font-size="15" font-weight="800">¥980</text>
    <rect x="172" y="230" width="44" height="4" rx="2" fill="#43D5B7"/>
    <path d="M190 244L195 250L200 244Z" fill="#49D3BB"/>

    <rect x="238" y="181" width="64" height="59" rx="13" fill="#092933" stroke="#28515A"/>
    <text x="249" y="198" fill="#668D91" font-size="8" font-weight="700">04 / 中</text>
    <text x="249" y="217" fill="#F1F8F6" font-size="13" font-weight="800">¥1.3k</text>
    <rect x="249" y="226" width="42" height="3" rx="1.5" fill="#50747A"/>

    <rect x="310" y="181" width="64" height="59" rx="13" fill="#211F34" stroke="#5A5275"/>
    <circle cx="361" cy="193" r="3.5" fill="#FA6B62"/>
    <text x="321" y="198" fill="#A69CBF" font-size="8" font-weight="700">05 / 雾</text>
    <text x="321" y="217" fill="#F4EDF8" font-size="13" font-weight="800">未知</text>
    <rect x="321" y="226" width="32" height="3" rx="1.5" fill="#7E739B"/>
  </g>

  <!-- 当前货柜：信息与货柜本身融成一个游戏舞台 -->
  <rect x="16" y="260" width="358" height="405" rx="22" fill="#082832" stroke="#1D5660" filter="url(#shadow)"/>
  <text x="35" y="289" fill="#56D8BF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">03 · 中价柜</text>
  <text x="35" y="312" fill="#F5FAF8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800">旧港转运留置物</text>
  <text x="355" y="287" text-anchor="end" fill="#75999B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">起拍价</text>
  <text x="355" y="310" text-anchor="end" fill="#F2C65E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="900">¥980</text>

  <!-- 2D 货柜插画 -->
  <g clip-path="url(#containerClip)">
    <rect x="39" y="329" width="312" height="146" rx="12" fill="#061B23"/>
    <circle cx="308" cy="347" r="81" fill="#1A6A68" opacity="0.13"/>
    <path d="M39 451C99 430 132 462 184 446C242 428 288 461 351 438V475H39Z" fill="#05212A" opacity="0.8"/>
    <rect x="55" y="349" width="280" height="106" rx="5" fill="url(#container)" stroke="#C2755D" stroke-opacity="0.55"/>
    <rect x="55" y="349" width="280" height="11" rx="3" fill="#6D3129"/>
    <rect x="55" y="444" width="280" height="11" rx="3" fill="#572721"/>
    <g stroke="#6B3028" stroke-width="4" opacity="0.78">
      <path d="M69 360V444M86 360V444M103 360V444M120 360V444M137 360V444M154 360V444M171 360V444M219 360V444M236 360V444M253 360V444M270 360V444M287 360V444M304 360V444M321 360V444"/>
    </g>
    <path d="M195 360V444M211 360V444" stroke="#3C201D" stroke-width="5"/>
    <path d="M190 365V438M216 365V438" stroke="#D29B7A" stroke-opacity="0.68" stroke-width="2"/>
    <rect x="185" y="392" width="37" height="34" rx="6" fill="#2B2524" stroke="#E0B476"/>
    <circle cx="203.5" cy="405" r="5" fill="#F0C964"/>
    <path d="M203.5 410V418" stroke="#F0C964" stroke-width="2" stroke-linecap="round"/>
    <path d="M79 377L108 370M276 420L310 426M129 431L147 425" stroke="#DA8E6F" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <rect x="70" y="368" width="58" height="19" rx="4" fill="#E1D6B9" opacity="0.9" transform="rotate(-3 70 368)"/>
    <text x="99" y="381" text-anchor="middle" fill="#5B4E3C" font-family="Arial, sans-serif" font-size="7" font-weight="700">YARD 03</text>
  </g>
  <rect x="39" y="329" width="312" height="146" rx="12" fill="none" stroke="#2F6269"/>
  <rect x="96" y="462" width="198" height="23" rx="11.5" fill="#061C24" stroke="#25545B"/>
  <circle cx="111" cy="473.5" r="3" fill="#43D5B7"/>
  <text x="123" y="477" fill="#AAC7C5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">点开后可检查一次，再决定参拍</text>

  <!-- 线索摘要 -->
  <rect x="35" y="499" width="320" height="72" rx="14" fill="#0B333C" stroke="#24545C"/>
  <text x="50" y="520" fill="#6D9699" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">申报</text>
  <text x="91" y="520" fill="#E8F4F1" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="700">船厂维修备件</text>
  <line x1="50" y1="535" x2="340" y2="535" stroke="#28515A"/>
  <text x="50" y="554" fill="#6D9699" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">外观</text>
  <text x="91" y="554" fill="#E8F4F1" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="700">门铰锈蚀 · 箱底有盐霜</text>
  <rect x="296" y="543" width="44" height="18" rx="7" fill="#173E43"/>
  <text x="318" y="555.5" text-anchor="middle" fill="#F1C762" font-family="Microsoft YaHei, Arial, sans-serif" font-size="7" font-weight="700">有风险</text>

  <!-- 主操作 -->
  <rect x="35" y="586" width="320" height="52" rx="16" fill="url(#cta)" filter="url(#buttonShadow)"/>
  <circle cx="126" cy="612" r="10" fill="#087A72" opacity="0.48"/>
  <path d="M121 612H131M126 607V617" stroke="#EFFFFB" stroke-width="2" stroke-linecap="round"/>
  <text x="204" y="617" text-anchor="middle" fill="#042A2B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="900">查看货柜</text>
  <text x="195" y="655" text-anchor="middle" fill="#668F92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">点上方卡片切换 · 今日只拍你看中的柜</text>

  <!-- 直播间常驻，但不抢主流程 -->
  <rect x="16" y="681" width="358" height="45" rx="14" fill="#0B2B35" stroke="#24515A"/>
  <circle cx="38" cy="703.5" r="11" fill="#163E48"/>
  <circle cx="38" cy="700" r="3.2" fill="#72A3A4"/>
  <path d="M32 709C33 704 43 704 44 709" fill="#72A3A4"/>
  <text x="57" y="699" fill="#F0F7F4" font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" font-weight="700">直播间还没开张</text>
  <text x="57" y="713" fill="#709599" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">开出第一件货，路人才会进来</text>
  <rect x="309" y="693" width="48" height="21" rx="8" fill="#123841"/>
  <text x="333" y="707" text-anchor="middle" fill="#9FC1BE" font-family="Microsoft YaHei, Arial, sans-serif" font-size="8">0 人</text>

  <!-- 底部导航 -->
  <path d="M0 747H390V844H0Z" fill="#041820"/>
  <path d="M0 747H390" stroke="#1D4149"/>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="9" text-anchor="middle">
    <g transform="translate(55 771)">
      <rect x="-10" y="-9" width="20" height="15" rx="3" fill="none" stroke="#47D1BA" stroke-width="2"/>
      <path d="M-13 -4H13" stroke="#47D1BA" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="29" fill="#53D7C0" font-weight="700">拍卖场</text>
      <rect x="-13" y="38" width="26" height="3" rx="1.5" fill="#43D5B7"/>
    </g>
    <g transform="translate(148 771)">
      <path d="M-11 -8H11V8H-11ZM-5 -8V8M5 -8V8" fill="none" stroke="#557A7F" stroke-width="2"/>
      <text x="0" y="29" fill="#66898C">仓库</text>
    </g>
    <g transform="translate(241 771)">
      <path d="M-11 4L0 -9L11 4V9H-11ZM-5 9V2H5V9" fill="none" stroke="#557A7F" stroke-width="2"/>
      <text x="0" y="29" fill="#66898C">交易摊</text>
    </g>
    <g transform="translate(334 771)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#557A7F" stroke-width="2"/>
      <path d="M-4 -1H4M-4 4H2" stroke="#557A7F" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="29" fill="#66898C">藏品册</text>
    </g>
  </g>
</svg>
